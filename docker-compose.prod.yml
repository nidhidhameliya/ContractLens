# ============================================================
# docker-compose.prod.yml - Production overrides
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================
services:
  api_gateway:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    env_file: backend/.env.production

  agent_service:
    command: uvicorn services.agent_service.main:app --host 0.0.0.0 --port 8001 --workers 2
    env_file: backend/.env.production

  ingestion_service:
    command: uvicorn services.ingestion_service.main:app --host 0.0.0.0 --port 8002 --workers 2
    env_file: backend/.env.production
